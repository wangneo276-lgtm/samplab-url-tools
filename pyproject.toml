[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "samplab-url-tools"
version = "0.1.0"
description = "Offline URL builder for SampLab Pro, a browser audio and MIDI tool suite. Not an official SDK."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "bbwdadfg" }]

[project.urls]
Homepage = "https://samplab.pro/"
Repository = "https://github.com/bbwdadfg/samplab-url-tools"
Issues = "https://github.com/bbwdadfg/samplab-url-tools/issues"

[tool.setuptools.packages.find]
where = ["python"]
include = ["samplab_url_tools*"]
